<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Viewer</title>
    <!-- SPLIT CSS FILES -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="chat.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
   
    <!-- DRAG AND DROP OVERLAY -->
    <div id="drag-overlay" class="hidden">
        <div class="drag-content">
            <span class="drag-icon">📁</span>
            <h2>Drop WhatsApp .zip or .txt files here</h2>
        </div>
    </div>
    
    <div id="app">
        <!-- LEFT SIDEBAR -->
        <div id="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <div class="header-actions">
                    <button id="theme-toggle" class="icon-btn" title="Toggle Theme">🌓</button>
                    <label for="file-input" class="icon-btn upload-btn" title="Upload Chats">➕</label>
                    <input type="file" id="file-input" accept=".txt, .zip" multiple hidden>
                </div>
            </div>
            
            <div id="loading" class="hidden">Processing files...</div>
            
            <div id="chat-list">
                <div class="empty-state">Upload .zip or .txt exports to see them here.</div>
            </div>
        </div>

        <!-- RIGHT MAIN VIEW -->
        <div id="main-view">
            <!-- Shown when no chat is clicked -->
            <div id="welcome-screen">
                <div class="welcome-drop-zone">
                    <span class="welcome-icon">📁</span>
                    <h2>Drop WhatsApp .zip or .txt files here</h2>
                </div>
            </div>

            <!-- Shown when a chat is clicked -->
            <div id="active-chat" class="hidden">
                <div class="chat-header">
                    <div class="chat-title-group">
                        <div id="header-avatar" class="avatar"></div>
                        <h2 id="chat-title">Chat Name</h2>
                    </div>
                    <select id="user-selector">
                        <option value="">Who are you?</option>
                    </select>
                </div>
                
                <div id="chat-container">
                    <!-- Messages injected here -->
                    <div id="scroll-anchor"></div>
                </div>

                <!-- Mock Input Area -->
                <div class="chat-input-area">
                    <span class="icon">➕</span>
                    <span class="icon">😀</span>
                    <div class="fake-input">Type a message</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SPLIT JAVASCRIPT FILES (Order matters!) -->
    <script src="utils.js"></script>
    <script src="parser.js"></script>
    <script src="ui.js"></script>
</body>
</html>
